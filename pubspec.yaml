name: deck_of_life
description: Deck of Life - your life, in your hands. Pusat informasi dan tanggung jawab pribadi. Android, local-first, offline-first.
publish_to: "none"
version: 1.0.0+1

environment:
  # Dart SDK minimal 3.12.2 (sesuai permintaan).
  sdk: ^3.12.2
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management, routing, dependency injection (TDD bagian 9).
  get: ^4.7.2

  # Database lokal.
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5

  # Notifikasi lokal. Dikunci di 19.x karena API initialize() berbeda di versi berikutnya.
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.1

  # Ekspor / impor backup.
  share_plus: ^11.0.0
  file_picker: ^10.3.0

  url_launcher: ^6.3.1

  uuid: ^4.5.1
  intl: ^0.20.2
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Database SQLite nyata di mesin dev untuk pengujian repository.
  sqflite_common_ffi: ^2.3.5

flutter:
  uses-material-design: true
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
